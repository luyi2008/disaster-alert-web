<div id="toast-stack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>
      <form id="subscribe-form">
        <div class="workspace">
          <div class="workspace-column">
            <section class="workspace-section">
              <div class="workspace-heading location-heading">
                <h2>监测地点</h2>
                <span id="location-count">0 / 3</span>
              </div>
              <div class="map-shell">
                <div id="map"></div>
                <div id="map-mode" class="map-mode">点击地图添加监测地点</div>
              </div>
              <div class="map-actions">
                <button type="button" id="start-add-location">手动输入坐标</button>
              </div>
              <div id="location-editor" class="location-editor" hidden>
                <div class="location-editor-heading">
                  <div>
                    <h3 id="location-editor-title" class="location-editor-title">添加监测地点</h3>
                    <span id="location-editor-subtitle" class="location-editor-subtitle"></span>
                  </div>
                </div>
                <div class="location-picker">
                  <span id="location-picker-heading" class="location-picker-heading">在地图点击位置，或输入坐标</span>
                  <div class="grid coordinate-grid">
                    <label class="input-label" for="latitude">纬度<input id="latitude" type="number" step="0.0001" min="-90" max="90" placeholder="例如：35.6762" /></label>
                    <label class="input-label" for="longitude">经度<input id="longitude" type="number" step="0.0001" min="-180" max="180" placeholder="例如：139.6503" /></label>
                  </div>
                </div>
                <div id="location-details" class="location-details" hidden>
                  <label class="input-label" for="location-name">地点名称（可选）<input id="location-name" type="text" maxlength="80" placeholder="例如：家、公司" /></label>
                  <div class="region-match">
                    <div class="region-match-copy">
                      <span class="region-match-label">区域匹配</span>
                      <span id="region-status" class="region-match-value">选点后自动解析</span>
                    </div>
                    <button id="edit-region" class="region-edit-toggle" type="button">手动填写</button>
                  </div>
                  <div id="region-editor" class="region-editor" hidden>
                    <div class="region-editor-inner">
                      <div class="grid admin-grid">
                        <label class="input-label" for="province">省/州<input id="province" type="text" maxlength="80" placeholder="可选" /></label>
                        <label class="input-label" for="city">城市<input id="city" type="text" maxlength="80" placeholder="可选" /></label>
                        <label class="input-label" for="district">区/县<input id="district" type="text" maxlength="80" placeholder="可选" /></label>
                      </div>
                      <small class="region-editor-note">填写行政区可提高气象预警覆盖，并用于海啸区域匹配。</small>
                    </div>
                  </div>
                </div>
                <div class="location-editor-actions">
                  <button id="discard-location-edit" class="location-editor-cancel" type="button">取消</button>
                  <button type="button" id="finish-location" class="primary">完成添加</button>
                </div>
              </div>
              <div class="locations-section">
                <div class="locations-section-heading"><span>已添加地点</span><span id="locations-summary">尚未添加</span></div>
                <div id="locations-list" class="locations-list"></div>
              </div>
            </section>
          </div>
          <div class="workspace-column">
            <section class="workspace-section">
              <div class="workspace-heading">
                <div class="workspace-heading-title">
                  <h2>预警类型</h2>
                  <span id="alert-type-sources" class="heading-sources" hidden></span>
                </div>
                <button class="heading-action" id="reset-alert-rules" type="button" disabled>重置规则</button>
              </div>
              <div id="disaster-groups" class="disaster-groups"></div>
            </section>
          </div>
        </div>
        <div class="form-actions">
          <a class="btn-ghost" href="/devices">返回设备</a>
          <div id="draft-status" class="form-actions-note"></div>
          <button class="secondary" id="unsubscribe" type="button">取消订阅</button>
          <button class="primary" id="submit" type="submit">保存订阅</button>
        </div>
      </form>
