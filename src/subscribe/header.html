<header>
      <div class="topline">
        <h1>发个通知</h1>
        <div id="status-shell" class="status-shell">
          <button id="service-status" class="status-trigger" type="button" aria-expanded="false" aria-controls="status-details">
            <span id="status-source-chips" class="status-source-chips">
              <span id="status-chip-wolfx" class="status-chip" hidden>Wolfx</span>
              <span id="status-chip-fanstudio" class="status-chip" hidden>FAN Studio</span>
              <span id="status-chip-huania" class="status-chip" hidden>Huania</span>
            </span>
            <span id="status-label" class="badge" role="status" aria-live="polite">状态未知</span>
          </button>
          <div id="status-details" class="status-popover" role="tooltip">
            <div class="status-popover-head">
              <strong>服务运行状态</strong>
              <span id="status-updated">等待更新</span>
            </div>
            <div id="status-source-list" class="status-source-list" hidden>
              <div id="status-source-wolfx" class="status-source" hidden>
                <span class="status-source-name">Wolfx</span>
                <span id="status-wolfx-meta" class="status-source-meta">尚未获取数据</span>
              </div>
              <div id="status-source-fanstudio" class="status-source" hidden>
                <span class="status-source-name">FAN Studio</span>
                <span id="status-fanstudio-meta" class="status-source-meta">尚未获取数据</span>
              </div>
              <div id="status-source-huania" class="status-source" hidden>
                <span class="status-source-name">Huania</span>
                <span id="status-huania-meta" class="status-source-meta">尚未获取数据</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <p class="subhead">将所选地点的提醒推送到当前设备</p>
    </header>
