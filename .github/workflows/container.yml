name: Build and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: container-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: container-deploy-main
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize env file
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
        run: |
          umask 077
          if [ -n "$DEPLOY_ENV_FILE" ]; then
            printf '%s\n' "$DEPLOY_ENV_FILE" > .env
          else
            cp .env.example .env
          fi

      - name: Copy Compose file and env to host
        uses: appleboy/scp-action@v1.0.0
        with:
          host: 47.108.147.136
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: compose.yaml,.env
          target: /opt/disaster-alert-web
          overwrite: true

      - name: Deploy container
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        with:
          host: 47.108.147.136
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE
          script: |
            set -euo pipefail
            cd /opt/disaster-alert-web
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
            docker pull "$IMAGE"
            DISASTER_ALERT_WEB_IMAGE="$IMAGE" docker compose up -d --no-build --remove-orphans
            docker image prune --force
            docker logout ghcr.io
